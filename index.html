<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atrapa el Cuadro</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:#222;
    color:white;
    text-align:center;
}
#game{
    width:90vw;
    height:70vh;
    border:3px solid white;
    margin:20px auto;
    position:relative;
    background:#333;
}
#box{
    width:50px;
    height:50px;
    background:red;
    position:absolute;
    cursor:pointer;
}
button{
    padding:10px 20px;
    font-size:18px;
}
</style>
</head>
<body>

<h1>Atrapa el Cuadro</h1>
<h2>Puntos: <span id="score">0</span></h2>

<div id="game">
    <div id="box"></div>
</div>

<button onclick="startGame()">Comenzar</button>

<script>
let score = 0;
const box = document.getElementById("box");
const game = document.getElementById("game");

function moveBox(){
    const x = Math.random() * (game.clientWidth - 50);
    const y = Math.random() * (game.clientHeight - 50);
    box.style.left = x + "px";
    box.style.top = y + "px";
}

box.onclick = function(){
    score++;
    document.getElementById("score").textContent = score;
    moveBox();
}

function startGame(){
    score = 0;
    document.getElementById("score").textContent = score;
    moveBox();
}
</script>

</body>
</html>
